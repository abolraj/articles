<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Articles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

<script>
  // apply saved theme + lang dir before first paint (no flash)
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
    var p = new URLSearchParams(location.search);
    var l = p.get('lang');
    if (l) {
      var rtl = /^(ar|arc|ckb|dv|fa|ha|he|khw|ks|prs|ps|sam|sd|ug|ur|yi)(-|$)/i.test(l);
      document.documentElement.lang = l;
      document.documentElement.dir  = rtl ? 'rtl' : 'ltr';
    }
  })();
</script>

<style>
  /* =========================================================
     TOKENS
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    color-scheme: light dark;

    --bg:          #fbf9f6;
    --fg:          #1e1c19;
    --muted:       #6d6861;
    --line:        #e7e1d7;
    --card:        #ffffff;
    --accent:      #b45309;
    --accent-soft: #f3e6d6;
    --code-bg:     #f4f0ea;

    --radius: 14px;
    --maxw: 44rem;
    --sans:  "Vazirmatn", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Vazirmatn", ui-serif, Georgia, Cambria, "Noto Naskh Arabic", "Times New Roman", Times, serif;
    --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:          #131211;
      --fg:          #ecebe7;
      --muted:       #a09a90;
      --line:        #2b2926;
      --card:        #1a1917;
      --accent:      #e2a75c;
      --accent-soft: #2a2219;
      --code-bg:     #1c1b18;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:          #131211;
    --fg:          #ecebe7;
    --muted:       #a09a90;
    --line:        #2b2926;
    --card:        #1a1917;
    --accent:      #e2a75c;
    --accent-soft: #2a2219;
    --code-bg:     #1c1b18;
  }

  /* =========================================================
     BASE
     ========================================================= */
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent-soft); }

  a { color: var(--accent); text-underline-offset: 2px; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: clamp(1.75rem, 5vw, 3.5rem) 1.25rem 6rem;
  }

  /* =========================================================
     SITE HEADER
     ========================================================= */
  .site-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2.25rem;
  }

  .brand {
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: -0.015em;
    color: var(--fg);
    text-decoration: none;
  }
  .brand:hover { color: var(--accent); }

  .site-desc {
    margin: 0.35rem 0 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .head-controls {
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  .theme-btn {
    flex: none;
    width: 2.15rem;
    height: 2.15rem;
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    line-height: 1;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .theme-btn:hover { color: var(--fg); border-color: var(--muted); }

  /* ---------- view switch (list / grid) ---------- */
  .view-switch {
    display: inline-flex;
    gap: 0.1rem;
    padding: 0.15rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }

  .view-pill {
    display: grid;
    place-items: center;
    width: 1.8rem;
    height: 1.8rem;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .view-pill:hover { color: var(--fg); }
  .view-pill.is-active { background: var(--accent-soft); color: var(--accent); }
  .view-pill svg { width: 0.98rem; height: 0.98rem; display: block; }

  /* =========================================================
     INDEX — LIST
     ========================================================= */
  .post-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.4rem;
  }

  .post {
    display: block;
    padding: 1.05rem 1.15rem;
    border: 1px solid transparent;
    border-top: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    transition: background .18s ease, border-color .18s ease;
  }
  .post:hover { 
    background: var(--card); 
    border-color: var(--line); 
    border-radius: var(--radius);
  }

  .post-title {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 650;
    letter-spacing: -0.012em;
    line-height: 1.35;
  }

  .post-date {
    display: block;
    margin-top: 0.3rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .post-excerpt {
    margin: 0.5rem 0 0;
    font-size: 0.93rem;
    line-height: 1.55;
    color: var(--muted);
  }

  .post-langs {
    margin-top: 0.55rem;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    opacity: 0.85;
  }

  /* =========================================================
     INDEX — GRID (instagram-ish)
     ========================================================= */
  .post-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr));
    gap: 0.85rem;
  }

  .post-card {
    display: flex;
    flex-direction: column;
    height: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .post-card:hover,
  .post-card:focus-visible {
    border-color: var(--muted);
    transform: translateY(-2px);
    box-shadow: 0 10px 26px -16px rgb(0 0 0 / .45);
  }

  .post-card .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--code-bg);
    overflow: hidden;
  }

  .post-card .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .4s ease;
  }
  .post-card:hover .thumb img { transform: scale(1.045); }

  /* no-image fallback */
  .thumb-empty {
    display: grid;
    place-items: center;
    color: var(--muted);
    background:
      radial-gradient(120% 120% at 12% 0%, var(--accent-soft) 0%, transparent 58%),
      var(--code-bg);
  }
  .post-card:nth-child(2n) .thumb-empty {
    background:
      radial-gradient(120% 120% at 88% 100%, var(--accent-soft) 0%, transparent 58%),
      var(--code-bg);
  }
  .post-card:nth-child(3n) .thumb-empty {
    background:
      radial-gradient(90% 90% at 50% 110%, var(--accent-soft) 0%, transparent 62%),
      var(--code-bg);
  }

  .thumb-icon {
    width: 2.1rem;
    height: 2.1rem;
    opacity: 0.45;
  }

  .card-body {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.7rem 0.8rem 0.8rem;
  }

  .post-card .post-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.97rem;
    line-height: 1.35;
  }

  .post-card .post-date {
    margin-top: 0;
    font-size: 0.66rem;
    letter-spacing: 0.07em;
  }

  @media (prefers-reduced-motion: reduce) {
    .post-card:hover,
    .post-card:focus-visible { transform: none; }
    .post-card:hover .thumb img { transform: none; }
  }

  /* =========================================================
     ARTICLE TOP BAR
     ========================================================= */
  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .back {
    display: inline-flex;
    align-items: center;
    font-size: 0.88rem;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover { color: var(--accent); }

  .back .arrow {
    display: inline-block;
    margin-inline-end: 0.4em;
    transition: transform .2s ease;
  }
  .back:hover .arrow { transform: translateX(-2px); }
  [dir="rtl"] .back .arrow { transform: scaleX(-1); }
  [dir="rtl"] .back:hover .arrow { transform: scaleX(-1) translateX(-2px); }

  .lang-switch {
    display: inline-flex;
    gap: 0.15rem;
    padding: 0.15rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
  }

  .lang-pill {
    display: inline-block;
    padding: 0.22rem 0.55rem;
    font-size: 0.68rem;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: var(--muted);
    border-radius: 999px;
    transition: color .15s ease, background .15s ease;
  }
  .lang-pill:hover { color: var(--fg); }
  .lang-pill.is-active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* =========================================================
     ARTICLE HEADER
     ========================================================= */
  .article-head {
    margin: 1.25rem 0 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line);
  }

  .article-head h1 {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 4.5vw, 2.4rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.025em;
    margin: 0 0 0.6rem;
  }

  .article-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- hero (optional) ---------- */
  .hero {
    margin: 0 0 2rem;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--code-bg);
    border: 1px solid var(--line);
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 26rem;
    object-fit: cover;
  }

  .hero figcaption {
    padding: 0.6rem 0.9rem;
    font-family: var(--sans);
    font-size: 0.78rem;
    line-height: 1.45;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* =========================================================
     PROSE
     ========================================================= */
  .prose {
    font-family: var(--serif);
    font-size: 1.075rem;
    line-height: 1.75;
    overflow-wrap: break-word;
  }

  .prose:lang(fa),
  .prose:lang(ar),
  .prose:lang(he),
  .prose:lang(ur),
  .prose:lang(ps),
  .prose:lang(sd) {
    font-family: "Vazirmatn", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, var(--sans);
    line-height: 1.85;
  }

  .prose > :first-child { margin-top: 0; }
  .prose > :last-child  { margin-bottom: 0; }

  .prose p { margin: 1.1em 0; }

  .prose h1, .prose h2, .prose h3,
  .prose h4, .prose h5, .prose h6 {
    font-family: var(--serif);
    line-height: 1.3;
    letter-spacing: -0.015em;
    font-weight: 650;
    margin: 2.1em 0 0.6em;
  }
  .prose h1 { font-size: 1.85rem; }
  .prose h2 {
    font-size: 1.42rem;
    padding-bottom: 0.28em;
    border-bottom: 1px solid var(--line);
  }
  .prose h3 { font-size: 1.2rem; }
  .prose h4 { font-size: 1.04rem; }
  .prose h5, .prose h6 {
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  .prose a:hover { text-decoration-thickness: 2px; }

  .prose strong { font-weight: 650; }
  .prose em { font-style: italic; }

  .prose ul, .prose ol {
    margin: 1.1em 0;
    padding-inline-start: 1.45em;
  }
  .prose li { margin: 0.35em 0; }
  .prose li::marker { color: var(--muted); }
  .prose li > ul, .prose li > ol { margin: 0.35em 0; }

  .prose blockquote {
    margin: 1.6em 0;
    padding-block: 0.15em;
    padding-inline-start: 1.15em;
    border-inline-start: 3px solid var(--accent);
    color: var(--muted);
    font-style: italic;
  }
  .prose blockquote p { margin: 0.5em 0; }

  .prose hr {
    border: 0;
    height: 1px;
    background: var(--line);
    margin: 2.75em 0;
  }

  .prose :not(pre) > code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.12em 0.36em;
    direction: ltr;
    unicode-bidi: isolate;
  }

  .prose pre {
    font-family: var(--mono);
    font-size: 0.875rem;
    line-height: 1.62;
    margin: 1.5em 0;
    padding: 1rem 1.1rem;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    tab-size: 2;
    direction: ltr;
    text-align: left;
  }
  .prose pre code {
    font-family: inherit;
    font-size: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
  }

  .code-wrap { position: relative; margin: 1.5em 0; direction: ltr !important; }
  .code-wrap pre { margin: 0; }

  .copy {
    position: absolute;
    top: 0.5rem;
    inset-inline-end: 0.5rem;
    font-family: var(--sans);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .code-wrap:hover .copy,
  .copy:focus-visible { opacity: 1; }
  .copy:hover { color: var(--fg); border-color: var(--muted); }
  @media (hover: none) { .copy { opacity: 1; } }

  .table-wrap { margin: 1.6em 0; overflow-x: auto; }
  .table-wrap table { margin: 0; min-width: 100%; }

  .prose table {
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 0.94em;
    line-height: 1.5;
  }
  .prose th, .prose td {
    padding: 0.55em 0.85em;
    border: 1px solid var(--line);
    text-align: start;
  }
  .prose th { background: var(--code-bg); font-weight: 650; }

  .prose img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 1.6em auto;
    border-radius: 10px;
  }

  .prose figure { margin: 1.6em 0; }
  .prose figcaption {
    margin-top: 0.6em;
    font-family: var(--sans);
    font-size: 0.82rem;
    text-align: center;
    color: var(--muted);
  }

  .prose kbd {
    font-family: var(--mono);
    font-size: 0.8em;
    padding: 0.1em 0.4em;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--code-bg);
    direction: ltr;
    unicode-bidi: isolate;
  }

  .prose mark {
    background: var(--accent-soft);
    color: inherit;
    padding: 0.05em 0.2em;
    border-radius: 3px;
  }

  /* =========================================================
     STATES
     ========================================================= */
  .status, .notice {
    font-family: var(--sans);
    color: var(--muted);
    font-size: 0.95rem;
  }
  .notice h1, .notice h2 {
    font-family: var(--serif);
    color: var(--fg);
    margin: 0 0 0.5rem;
    font-size: 1.4rem;
  }
  .notice code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.1em 0.35em;
  }

  /* =========================================================
     PRINT
     ========================================================= */
  @media print {
    .theme-btn, .back, .copy, .lang-switch, .view-switch { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { max-width: none; padding: 0; }
    .prose a { color: inherit; }
    .hero { border: 0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header id="header" class="site-head"></header>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SITE = {
  title: 'Abolfazl Rajaee',
  description: 'Essays, notes, and things I figure out.',
};

const ARTICLES_BASE = 'articles';   // must match ARTICLES_BASE in build.js

/* =========================================================
   ICONS
   ========================================================= */
const ICON_LIST = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
  <path d="M9 6h11M9 12h11M9 18h11"/>
  <circle cx="4.4" cy="6" r="1.3" fill="currentColor" stroke="none"/>
  <circle cx="4.4" cy="12" r="1.3" fill="currentColor" stroke="none"/>
  <circle cx="4.4" cy="18" r="1.3" fill="currentColor" stroke="none"/>
</svg>`;

const ICON_GRID = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
  <rect x="3.6" y="3.6" width="7" height="7" rx="1.6"/>
  <rect x="13.4" y="3.6" width="7" height="7" rx="1.6"/>
  <rect x="3.6" y="13.4" width="7" height="7" rx="1.6"/>
  <rect x="13.4" y="13.4" width="7" height="7" rx="1.6"/>
</svg>`;

/* simple "photo" placeholder for articles without a hero image */
const PHOTO_SVG = `<svg class="thumb-icon" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true" focusable="false">
  <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
  <circle cx="8.3" cy="9.8" r="1.5"/>
  <path d="M20.5 16.2l-4.7-4.7-6.1 6.1"/>
</svg>`;

/* =========================================================
   HELPERS
   ========================================================= */
const app    = document.getElementById('app');
const header = document.getElementById('header');
header.dir = 'ltr';

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// build.js stores hero paths relative to the article folder — prepend base
function heroSrc(p) {
  if (!p) return null;
  return /^(?:[a-z][a-z0-9+.-]*:|\/)/i.test(p) ? p : `${ARTICLES_BASE}/${p}`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const s = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T00:00:00' : iso;
  const d = new Date(s);
  return isNaN(d) ? iso
    : d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

let cache = null;
async function getArticles() {
  if (cache) return cache;
  const res = await fetch('articles.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(`articles.json → HTTP ${res.status}`);
  cache = await res.json();
  return cache;
}

function setMeta(name, content) {
  if (!content) return;
  const isOg = name.startsWith('og:');
  const sel  = isOg ? `meta[property="${name}"]` : `meta[name="${name}"]`;
  let el = document.querySelector(sel);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(isOg ? 'property' : 'name', name);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content);
}

function langName(code) {
  try {
    const dn = new Intl.DisplayNames([navigator.language || 'en'], { type: 'language' });
    return dn.of(code) || code;
  } catch (_) { return code; }
}

/* =========================================================
   THEME
   ========================================================= */
const THEME_ICON  = { auto: '◐', dark: '☾', light: '☀' };
const THEME_LABEL = { auto: 'Theme: auto (follows system)', dark: 'Theme: dark', light: 'Theme: light' };

function currentTheme() {
  return document.documentElement.dataset.theme || 'auto';
}

function applyTheme(t) {
  if (t === 'auto') {
    delete document.documentElement.dataset.theme;
    try { localStorage.removeItem('theme'); } catch (_) {}
  } else {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (_) {}
  }
  syncThemeButtons();
}

function cycleTheme() {
  const cur = currentTheme();
  applyTheme(cur === 'auto' ? 'dark' : cur === 'dark' ? 'light' : 'auto');
}

function syncThemeButtons() {
  const t = currentTheme();
  document.querySelectorAll('[data-theme-btn]').forEach(btn => {
    btn.textContent = THEME_ICON[t];
    btn.title = THEME_LABEL[t];
    btn.setAttribute('aria-label', THEME_LABEL[t]);
  });
}

/* =========================================================
   VIEW MODE  (list | grid)
   ========================================================= */
const VIEW_KEY = 'view';

function currentView() {
  try {
    const v = localStorage.getItem(VIEW_KEY);
    if (v === 'grid' || v === 'list') return v;
  } catch (_) {}
  return 'list';
}

function setView(v) {
  if (v !== 'grid' && v !== 'list') return;
  try { localStorage.setItem(VIEW_KEY, v); } catch (_) {}
  syncViewButtons();
  // re-render only the index (article pages don't show the switch)
  if (!new URLSearchParams(location.search).get('q')) renderIndex();
}

function syncViewButtons() {
  const v = currentView();
  document.querySelectorAll('[data-view]').forEach(btn => {
    const on = btn.dataset.view === v;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = btn.dataset.view === 'grid' ? 'Grid view' : 'List view';
    btn.setAttribute('aria-label', btn.title);
  });
}

/* =========================================================
   HEADER
   ========================================================= */
function renderHeader(withDescription, opts = {}) {
  const showViewSwitch = !!opts.viewToggle;

  header.innerHTML = `
    <div>
      <a class="brand" href="./">${esc(SITE.title)}</a>
      ${withDescription && SITE.description
        ? `<p class="site-desc">${esc(SITE.description)}</p>` : ''}
    </div>
    <div class="head-controls">
      ${showViewSwitch ? `
        <div class="view-switch" role="group" aria-label="Layout">
          <button class="view-pill" type="button" data-view="list"
                  onclick="setView('list')">${ICON_LIST}</button>
          <button class="view-pill" type="button" data-view="grid"
                  onclick="setView('grid')">${ICON_GRID}</button>
        </div>` : ''}
      <button class="theme-btn" type="button" data-theme-btn onclick="cycleTheme()"></button>
    </div>
  `;

  syncThemeButtons();
  if (showViewSwitch) syncViewButtons();
}

/* =========================================================
   LANGUAGE PICKING
   ========================================================= */
function pickLang(item, requested) {
  if (requested && item.meta[requested]) return requested;

  try {
    const stored = localStorage.getItem('lang');
    if (stored && item.meta[stored]) return stored;
  } catch (_) {}

  const nav = (navigator.language || '').split('-')[0].toLowerCase();
  if (nav && item.meta[nav]) return nav;

  return item.defaultLang;
}

function resetDir() {
  document.documentElement.lang = 'en';
  document.documentElement.dir  = 'ltr';
}

/* =========================================================
   INDEX
   ========================================================= */
async function renderIndex() {
  renderHeader(true, { viewToggle: true });
  resetDir();
  document.title = SITE.title;
  setMeta('description', SITE.description);

  if (!cache) app.innerHTML = `<p class="status">Loading…</p>`;

  try {
    const items = await getArticles();

    if (!items.length) {
      app.innerHTML = `<p class="status">No articles yet. Create a folder
        inside <code>${esc(ARTICLES_BASE)}/</code> with one or more language files
        (e.g. <code>en.md</code>, <code>fa.md</code>), then run
        <code>node build.js</code>.</p>`;
      return;
    }

    if (currentView() === 'grid') {
      app.innerHTML = gridHtml(items);
      attachThumbFallbacks();
    } else {
      app.innerHTML = listHtml(items);
    }
  } catch (err) {
    showError(err);
  }
}

/* ---------- list view ---------- */
function listHtml(items) {
  return `<ul class="post-list">${items.map(item => {
    const lang = pickLang(item, null);
    const m    = item.meta[lang];
    return `
      <li>
        <a class="post" href="?q=${encodeURIComponent(item.slug)}">
          <h2 class="post-title" lang="${esc(lang)}" dir="${esc(m.dir)}">${esc(m.title)}</h2>
          ${item.date
            ? `<time class="post-date" datetime="${esc(item.date)}">${esc(fmtDate(item.date))}</time>`
            : ''}
          ${m.excerpt
            ? `<p class="post-excerpt" lang="${esc(lang)}" dir="${esc(m.dir)}">${esc(m.excerpt)}</p>`
            : ''}
          ${item.langs.length > 1
            ? `<div class="post-langs">${item.langs.map(esc).join(' · ').toUpperCase()}</div>`
            : ''}
        </a>
      </li>`;
  }).join('')}</ul>`;
}

/* ---------- grid view (instagram-ish) ---------- */
function gridHtml(items) {
  return `<ul class="post-grid">${items.map(item => {
    const lang = pickLang(item, null);
    const m    = item.meta[lang];
    const src  = heroSrc(m.hero);

    const thumb = src
      ? `<div class="thumb">
           <img src="${esc(src)}" alt="" loading="lazy" decoding="async">
         </div>`
      : `<div class="thumb thumb-empty" aria-hidden="true">${PHOTO_SVG}</div>`;

    return `
      <li>
        <a class="post-card" href="?q=${encodeURIComponent(item.slug)}"
           title="${esc(m.title)}">
          ${thumb}
          <div class="card-body">
            <h2 class="post-title" lang="${esc(lang)}" dir="${esc(m.dir)}">${esc(m.title)}</h2>
            ${item.date
              ? `<time class="post-date" datetime="${esc(item.date)}">${esc(fmtDate(item.date))}</time>`
              : ''}
          </div>
        </a>
      </li>`;
  }).join('')}</ul>`;
}

/* if a hero image 404s, degrade gracefully to the placeholder */
function attachThumbFallbacks() {
  app.querySelectorAll('.post-card .thumb img').forEach(img => {
    img.addEventListener('error', () => {
      const thumb = img.closest('.thumb');
      if (!thumb) return;
      thumb.classList.add('thumb-empty');
      thumb.setAttribute('aria-hidden', 'true');
      thumb.innerHTML = PHOTO_SVG;
    }, { once: true });
  });
}

/* =========================================================
   ARTICLE
   ========================================================= */
async function renderArticle(slug, requestedLang) {
  renderHeader(false);
  app.innerHTML = `<p class="status">Loading…</p>`;

  try {
    if (typeof marked === 'undefined') {
      throw new Error('Markdown renderer failed to load (offline?)');
    }

    const items = await getArticles();
    const item  = items.find(a => a.slug === slug);
    if (!item) return notFound(slug);

    const lang = pickLang(item, requestedLang);
    const meta = item.meta[lang];
    if (!meta) throw new Error(`No metadata for language "${lang}"`);

    document.documentElement.lang = lang;
    document.documentElement.dir  = meta.dir || 'ltr';

    // ↓ article folder is under ARTICLES_BASE/
    const folderPath = `${ARTICLES_BASE}/${encodeURIComponent(item.dir)}`;
    const path       = `${folderPath}/${encodeURIComponent(lang)}.md`;

    const res = await fetch(path);
    if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);

    // strip front matter, then a leading "# Title" (we render the title ourselves)
    const md = (await res.text())
      .replace(/^---\r?\n[\s\S]*?\r?\n---[ \t]*(?:\r?\n|$)/, '')
      .replace(/^\s*#\s+[^\n]*(?:\n+|$)/, '');

    const words = md.trim().split(/\s+/).filter(Boolean).length;
    const mins  = Math.max(1, Math.round(words / 220));

    const heroUrl = heroSrc(meta.hero);

    document.title = `${meta.title} — ${SITE.title}`;
    setMeta('description', meta.excerpt || '');
    setMeta('og:type', 'article');
    setMeta('og:title', meta.title);
    setMeta('og:description', meta.excerpt || '');
    if (heroUrl) setMeta('og:image', new URL(heroUrl, location.href).href);

    const heroHtml = heroUrl ? `
      <figure class="hero">
        <img src="${esc(heroUrl)}"
             alt="${esc(meta.heroAlt || meta.title)}"
             loading="eager" decoding="async"
             onerror="this.closest('figure').remove()">
        ${meta.heroCaption ? `<figcaption>${esc(meta.heroCaption)}</figcaption>` : ''}
      </figure>` : '';

    const langNav = item.langs.length > 1 ? `
      <nav class="lang-switch" aria-label="Language">
        ${item.langs.map(l => `
          <a class="lang-pill${l === lang ? ' is-active' : ''}"
             href="?q=${encodeURIComponent(item.slug)}&lang=${encodeURIComponent(l)}"
             hreflang="${esc(l)}"
             lang="${esc(l)}"
             title="${esc(langName(l))}"
             ${l === lang ? 'aria-current="page"' : ''}>${esc(l.toUpperCase())}</a>
        `).join('')}
      </nav>` : '';

    app.innerHTML = `
      <article>
        <div class="article-top" dir="ltr">
          <a class="back" href="./">
            All articles
          </a>
          ${langNav}
        </div>
        <header class="article-head">
          <h1>${esc(meta.title)}</h1>
          <div class="article-meta">
            ${item.date ? `<time datetime="${esc(item.date)}">${esc(fmtDate(item.date))}</time>
                           <span aria-hidden="true">·</span>` : ''}
            <span>${mins} min read</span>
          </div>
        </header>
        ${heroHtml}
        <div class="prose" id="prose">${marked.parse(md, { gfm: true, breaks: false })}</div>
      </article>`;

    const prose = document.getElementById('prose');
    absolutize(prose, `${folderPath}/`);
    enhance(prose);

    document.querySelectorAll('.lang-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        try { localStorage.setItem('lang', pill.getAttribute('hreflang')); } catch (_) {}
      });
    });
  } catch (err) {
    showError(err);
  }
}

/* =========================================================
   RELATIVE URL FIXUP
   Inside articles/hello-world/fa.md, "diagram.png" must
   resolve to articles/hello-world/diagram.png
   (document URL is /index.html?q=…)
   ========================================================= */
const SRC_SEL = 'img[src], video[src], audio[src], iframe[src], source[src], track[src], embed[src]';

function absolutize(root, base) {
  const external = s => /^(?:[a-z][a-z0-9+.-]*:|\/|\?|#)/i.test(s);

  root.querySelectorAll(SRC_SEL).forEach(el => {
    const src = el.getAttribute('src');
    if (!src || external(src)) return;
    el.setAttribute('src', base + src);
  });

  root.querySelectorAll('a[href]').forEach(el => {
    const href = el.getAttribute('href');
    if (!href || external(href)) return;
    el.setAttribute('href', base + href);
  });
}

/* =========================================================
   POST-RENDER SUGAR
   ========================================================= */
function enhance(root) {
  root.querySelectorAll('pre').forEach(pre => {
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.replaceWith(wrap);
    wrap.appendChild(pre);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.textContent = 'Copy';
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pre.innerText);
        btn.textContent = 'Copied';
      } catch {
        btn.textContent = 'Failed';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
    });
    wrap.appendChild(btn);
  });

  root.querySelectorAll('table').forEach(table => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    table.replaceWith(wrap);
    wrap.appendChild(table);
  });

  root.querySelectorAll('a[href^="http"]').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
}

/* =========================================================
   STATES
   ========================================================= */
function notFound(slug) {
  resetDir();
  document.title = `Not found — ${SITE.title}`;
  app.innerHTML = `
    <div class="notice">
      <h1>Article not found</h1>
      <p>Nothing matches <code>${esc(slug)}</code>.</p>
      <p><a class="back" href="./"><span class="arrow" aria-hidden="true">←</span>All articles</a></p>
    </div>`;
}

function showError(err) {
  resetDir();
  app.innerHTML = `
    <div class="notice">
      <h1>Couldn't load</h1>
      <p>${esc(err.message)}</p>
      <p>Serve the folder over HTTP (not <code>file://</code>) and make sure
         <code>articles.json</code> exists — run <code>node build.js</code> to generate it.</p>
    </div>`;
}

/* =========================================================
   BOOT
   ========================================================= */
const params = new URLSearchParams(location.search);
const q      = params.get('q');
const langQ  = params.get('lang');

// allow deep-linking a layout: ?view=grid
const viewQ = params.get('view');
if (viewQ === 'grid' || viewQ === 'list') {
  try { localStorage.setItem(VIEW_KEY, viewQ); } catch (_) {}
}

q ? renderArticle(q, langQ) : renderIndex();
</script>
</body>
